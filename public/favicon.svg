<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E8E34" />
      <stop offset="100%" stop-color="#224215" />
    </linearGradient>
    <!-- Brand Orange/Gold Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B041" />
      <stop offset="100%" stop-color="#E68C3A" />
    </linearGradient>
  </defs>

  <g transform="translate(2, 2)">
    <!-- 1. Left Green Stem (Calligraphy Crescent arch) -->
    <path d="M 28,30 
             C 32,38 42,72 40,86 
             C 37,74 30,50 28,30 Z" 
          fill="url(#greenGrad)" />

    <!-- 2. Outer Green Loop of D -->
    <path d="M 28,30 
             C 48,16 94,24 94,56 
             C 94,76 76,92 60,92
             C 78,92 98,76 98,56 
             C 98,30 50,20 28,30 Z" 
          fill="url(#greenGrad)" />

    <!-- 3. Inner Orange Ribbon -->
    <path d="M 44,32 
             C 68,36 80,54 78,72 
             C 76,82 52,94 36,90
             C 54,94 82,84 82,72 
             C 82,52 68,34 44,32 Z" 
          fill="url(#orangeGrad)" />

    <!-- 4. Floating Pixel Accents -->
    <rect x="88" y="24" width="4.5" height="4.5" rx="1" fill="url(#orangeGrad)" />
    <rect x="96" y="22" width="2.5" height="2.5" rx="0.5" fill="url(#orangeGrad)" />
    <rect x="90" y="31" width="3" height="3" rx="0.8" fill="url(#orangeGrad)" />
    <rect x="82" y="26" width="2.2" height="2.2" rx="0.5" fill="url(#orangeGrad)" />
  </g>
</svg>